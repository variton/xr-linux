[package]
name = "xllm_requester"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Reusable LLM utilities for Rust CLIs"
repository = "https://github.com/variton/xr-linux/tree/main/unit-test-generator"

[dependencies]

async-openai = { version = "0.38.2", default-features = false, features = ["_api", "rustls", "responses"] }
tracing-attributes = "0.1.30"
anyhow = "1.0.100"
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4.5.54", features = ["derive"] }
serde = "1.0.228"
tempfile = "3"


[profile.release]
opt-level = 3
lto = true          # or "thin" if build times get annoying
codegen-units = 1
panic = "abort"     # usually fine for services/CLIs; can reduce overhead a bit
debug = 0
